name: Verification

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: verification-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # SvelteKit's static env modules must be populated for type generation;
      # verification never contacts these services and uses placeholders only.
      PUBLIC_SUPABASE_URL: https://example.supabase.co
      PUBLIC_SUPABASE_ANON_KEY: ci-placeholder
      DISCORD_BOT_TOKEN: ci-placeholder
      DISCORD_GUILD_ID: ci-placeholder
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          persist-credentials: false
      # pnpm のバージョンは package.json の packageManager から読む（二重指定するとエラーになる）
      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
      # Node のバージョンは mise.toml を正本にしてローカルと揃える（setup-node v7.1.0 以降が mise.toml を読める）
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: mise.toml
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm test
      - run: pnpm build

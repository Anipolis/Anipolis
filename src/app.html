<!doctype html>
<html lang="ja">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1">
		<meta name="text-scale" content="scale">
		<link
			rel="icon"
			href="%sveltekit.assets%/anipolis-logo-light.png"
			type="image/png"
			media="(prefers-color-scheme: light)"
		>
		<link
			rel="icon"
			href="%sveltekit.assets%/anipolis-logo-dark.png"
			type="image/png"
			media="(prefers-color-scheme: dark)"
		>
		<meta name="description" content="アニメファンのためのSNS。視聴中のアニメを記録して、感想を投稿・共有しよう。">
		<meta name="robots" content="index, follow">
		<script nonce="%sveltekit.nonce%">
		(() => {
			// ---- Theme detection ----
			const theme = localStorage.getItem("theme");
			if (theme === "light" || theme === "dark") {
				document.documentElement.setAttribute("data-theme", theme);
			} else if (window.matchMedia("(prefers-color-scheme: dark)").matches) {
				document.documentElement.setAttribute("data-theme", "dark");
			} else {
				// Set default theme to light
				document.documentElement.setAttribute("data-theme", "light");
			}
			if (window.location.pathname.indexOf("/rooms/anime/") === 0) {
				document.documentElement.classList.add("room-scroll-lock");
			}
		})();
		</script>
		%sveltekit.head%
	</head>

	<body data-sveltekit-preload-data="hover">
		<a href="#main-content" class="skip-to-main">メインコンテンツへスキップ</a>
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
